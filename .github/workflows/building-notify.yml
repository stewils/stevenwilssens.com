# Tells steven.wilssens.com that this project changed, so its "Building steven.wilssens.com"
# write-up can be refreshed from CLAUDE.md and the agent team (.claude/, the Review and
# Site update workflows, the gate scripts): the Site update workflow there reads the commits
# and the files, and opens a pull request when the write-up needs a change.
# Once a day, not on every push: one refresh covers the day's changes (a refresh and its review
# cost money, and on busy days most of them were replaced by the next one). Run it by hand to
# refresh now.
# Secret: BUILDING_TOKEN, a fine-grained token with Contents: read and write on
# stewils/stevenwilssens.com (repository_dispatch needs write). Without it, nothing happens.
name: Building write-up

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  notify:
    # By hand only from main: the refresh is about main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Tell steven.wilssens.com
        env:
          TOKEN: ${{ secrets.BUILDING_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PROJECT: site
        run: |
          # Fails without the token, so the next run still starts from the last run that did tell the site.
          if [ -z "$TOKEN" ]; then echo "::error::BUILDING_TOKEN is not set; steven.wilssens.com was not told."; exit 1; fi
          # The write-up's sources (src/articles/sources.json lists the same).
          paths=(CLAUDE.md README.md .claude .github/workflows/review.yml .github/workflows/site-update.yml ':(glob)scripts/*-check.mjs' ':(glob)scripts/*-gate.mjs' ':(glob)scripts/*-compare.mjs' scripts/review-roster.mjs)
          sha=$(git rev-parse HEAD)
          # Since the commit the last successful run saw, so a late or missed run neither skips nor repeats a
          # change; the last day when there is none (the first run, or history rewritten).
          before=$(gh run list --workflow building-notify.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          if ! [[ "$before" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$before" "$sha" 2>/dev/null; then
            before=$(git rev-list -1 --first-parent --before='24 hours ago' HEAD)
          fi
          if [ -n "$before" ] && git diff --quiet "$before" "$sha" -- "${paths[@]}"; then
            echo "No change to the write-up's sources since ${before::7}; nothing to refresh."
            exit 0
          fi
          # The newest change that touched them names the refresh; the others are counted.
          subjects=$(git log --first-parent --format=%s ${before:+"$before".."$sha"} -- "${paths[@]}")
          count=$(printf '%s\n' "$subjects" | grep -c . || true)
          subject=$(printf '%s\n' "$subjects" | head -n 1)
          if [ "$count" -gt 1 ]; then subject="$subject (and $((count - 1)) more)"; fi
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${before:-$sha}...$sha"
          payload=$(jq -cn --arg project "$PROJECT" --arg repository "$GITHUB_REPOSITORY" --arg before "$before" --arg sha "$sha" --arg compare "$compare" --arg subject "$subject" \
            '{event_type: "building-source-changed", client_payload: {project: $project, repository: $repository, before: $before, sha: $sha, compare: $compare, subject: $subject}}')
          curl -fsS -X POST "https://api.github.com/repos/stewils/stevenwilssens.com/dispatches" \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload"
          echo "steven.wilssens.com was told: $PROJECT changed $count time(s) up to ${sha::7}."
