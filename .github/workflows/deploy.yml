name: Deploy

on:
  push:
    # main deploys to production; other branches get a preview at
    # https://<branch>.stevenwilssens.pages.dev. Every branch lives in this
    # repository, so the push already covers each pull request; a pull_request
    # trigger would only add a second run, and one that needs manual approval
    # when the Site update workflow's bot opened the pull request.
    branches: ['**', '!dependabot/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 21e6959f04e3150f239a40191fb1297a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build scores the resume and compares it with the one recruiters download today
      # (the live site's /resume-report.json); dist/resume-report.json carries both scores.
      - run: npm run build
        env:
          RESUME_BASELINE: https://steven.wilssens.com/resume-report.json
      - name: Warn when the resume would score lower than the live one
        run: |
          line=$(jq -r 'if .baseline == null then "\(.score)/100 (the live score could not be read)" elif .baseline.lower then "\(.baseline.score) → \(.score), lower than the live site" elif .baseline.change > 0 then "\(.baseline.score) → \(.score), higher than the live site" else "\(.baseline.score) → \(.score), unchanged" end' dist/resume-report.json 2>/dev/null || echo unknown)
          echo "### Resume score: $line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.baseline.lower // false' dist/resume-report.json 2>/dev/null)" = true ]; then
            echo "::warning title=Resume score dropped::Resume score $line. Fix the data before merging, or merge knowing the trade-off."
            { echo; echo "⚠️ This resume scores lower than the live one. Findings:"; jq -r '.findings[] | select(.severity != "info") | "- [\(.severity)] \(.message)"' dist/resume-report.json; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; skipping deploy."
            exit 0
          fi
          npx wrangler pages deploy --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
          if [ "$GITHUB_REF_NAME" != main ]; then
            alias=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-28)
            echo "### Preview: https://$alias.stevenwilssens.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: node scripts/indexnow.mjs

      # Steven asked to be told when the resume has been updated: here, when a deploy to main changed the PDF or the resume data.
      # scripts/resume-mail.mjs reads src/resume.ts at both commits, has Claude say in plain words what is different
      # (without the key it lists the changes itself), adds the score against the live site, and sends the HTML email.
      - name: Email Steven that the resume is live
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          BEFORE: ${{ github.event.before }}
          TITLE: ${{ github.event.head_commit.message }}
        run: node scripts/resume-mail.mjs live --before "$BEFORE" --after "$GITHUB_SHA" --report dist/resume-report.json --title "$TITLE" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
