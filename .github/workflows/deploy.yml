name: Deploy

on:
  push:
    # main deploys to production; other branches get a preview at
    # https://<branch>.stevenwilssens.pages.dev
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 21e6959f04e3150f239a40191fb1297a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; skipping deploy."
            exit 0
          fi
          npx wrangler pages deploy --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
          if [ "$GITHUB_REF_NAME" != main ]; then
            alias=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-28)
            echo "### Preview: https://$alias.stevenwilssens.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: node scripts/indexnow.mjs

      # Steven asked to be told when the resume has been updated: here, when a deploy to main changed the PDF or the resume data.
      - name: Email Steven that the resume is live
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST }}
          BEFORE: ${{ github.event.before }}
          TITLE: ${{ github.event.head_commit.message }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(public/steven-wilssens-resume-2026\.pdf|src/resume\.ts)$'; then
            echo "The resume did not change in this deploy; no email."
            exit 0
          fi
          score=$(jq -r '"\(.score)/100, \(.pages) pages, \(.warnings) warnings"' dist/resume-report.json 2>/dev/null || echo unknown)
          {
            echo "Your updated resume is live."
            echo
            echo "Change: $(printf '%s' "$TITLE" | head -1)"
            echo "Resume score: $score"
            echo
            echo "Resume PDF: https://steven.wilssens.com/steven-wilssens-resume-2026.pdf"
            echo "Experience page: https://steven.wilssens.com/experience"
            echo "Home: https://steven.wilssens.com/"
            echo
            echo "Deploy: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/mail.txt
          python3 scripts/send-mail.py --subject "Resume live on steven.wilssens.com" --body-file /tmp/mail.txt
