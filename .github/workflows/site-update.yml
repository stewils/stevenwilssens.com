# Site update: Claude Code changes the site and the resume on a branch and opens a
# pull request. Started by the private MCP server (request_site_update) or by hand
# from the Actions tab. The deploy workflow then builds a preview for the branch.
#
# Secrets: ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`)
# for Claude Code. Everything else uses the built-in GITHUB_TOKEN: pushes made with
# it do not start other workflows, so this one dispatches the Deploy workflow for the
# branch itself to get the preview. The repository must allow Actions to create pull
# requests (Settings → Actions → General → Workflow permissions).
name: Site update

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'What to change, in plain words (facts, wording, a new section, a resume fix)'
        required: true
        type: string
      title:
        description: 'Short title for the branch and the pull request'
        required: true
        type: string
      proposals:
        description: 'Ids of the résumé proposals this update applies, comma-separated (the MCP server marks them applied when the pull request merges)'
        required: false
        type: string
        default: ''
      supersedes:
        description: 'The number of a pull request this run redoes (it is closed when the new pull request opens)'
        required: false
        type: string
        default: ''

# The run is named after the title so the MCP server can find it right after starting it.
run-name: ${{ inputs.title }}

concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Install Chromium for the resume PDF
        run: npx playwright-core install --with-deps chromium

      - name: Create the branch
        id: branch
        env:
          TITLE: ${{ inputs.title }}
        run: |
          slug=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//' | cut -c1-40)
          branch="update/${slug:-change}-${GITHUB_RUN_NUMBER}"
          git checkout -b "$branch"
          git config user.name "Steven Wilssens (via Claude)"
          git config user.email "steven@wilssens.com"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The score the change is measured against: main's resume, scored against main's data,
      # before anything is touched. The pull request and the email say whether the update
      # keeps it, raises it or lowers it.
      - name: Score the resume on main
        id: baseline
        run: |
          node scripts/resume-check.mjs --json /tmp/resume-before.json || true
          score=$(jq -r '.score // "unknown"' /tmp/resume-before.json 2>/dev/null || echo unknown)
          echo "score=$score" >> "$GITHUB_OUTPUT"
          echo "Resume on main: $score/100"

      - name: Let Claude make the change
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are updating steven.wilssens.com, Steven Wilssens's resume site. Read CLAUDE.md first and follow it.

            Steven's instruction:
            ${{ inputs.instruction }}

            Rules for this change:
            - Facts about Steven (roles, bullets, headline, summary, skills, impact numbers, selected work, location, authorization) live in src/resume.ts. Change them there, not in App.tsx.
            - After any change to src/resume.ts, run `npm run resume:build`. It regenerates public/steven-wilssens-resume-2026.pdf and refuses a resume that scores worse than the current one; read its findings and fix the data until it passes. Never commit a resume with errors.
            - The resume on main scores ${{ steps.baseline.outputs.score }}/100 with applicant tracking systems: the ATS score (`node scripts/resume-check.mjs` shows the findings and which of them count). Keep it there or raise it. Never pass `--force` to resume:build. If Steven's instruction cannot be carried out without lowering the score (a bullet he wants removed carried a keyword or a number, say), make the change he asked for, keep the data honest, and say plainly in your summary which check got worse and why: the workflow warns him and he decides.
            - If the headline or the photo changed, run `node scripts/og-image.mjs`.
            - Run `npm run lint`, `npm test` and `npm run build` and make them pass.
            - Do not invent numbers or facts. If the instruction needs a fact you do not have, leave a `TODO(steven): question` comment in src/resume.ts and list the question in your final message.
            - Commit nothing yourself; the workflow commits and opens the pull request. End with a short summary of what changed and any open questions, written for Steven.
          claude_args: '--max-turns 250 --allowedTools "Read,Edit,Write,MultiEdit,Glob,Grep,Bash(npm run *),Bash(npm test*),Bash(node scripts/*),Bash(npx vitest*),Bash(git diff*),Bash(git status*),Bash(ls*)"'

      - name: Check, commit and push
        id: commit
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          TITLE: ${{ inputs.title }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -e
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude made no changes."
            exit 0
          fi
          status=passed
          (npm run lint && npm test && npm run build) || status=failed
          git add -A
          git commit -m "$TITLE" -m "$INSTRUCTION" -m "Requested through the MCP server; made by Claude Code in the Site update workflow (run ${GITHUB_RUN_ID})." -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push -u origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "checks=$status" >> "$GITHUB_OUTPUT"

      # The new resume against the one main had: the score line goes into the pull request,
      # the step summary and the email, and a drop is a warning on the run.
      - name: Compare the resume score with main
        id: score
        if: steps.commit.outputs.changed == 'true'
        env:
          BEFORE: ${{ steps.baseline.outputs.score }}
        run: |
          node scripts/resume-check.mjs --json /tmp/resume-after.json --baseline /tmp/resume-before.json > /tmp/resume-after.txt || true
          cat /tmp/resume-after.txt
          after=$(jq -r '.score // "unknown"' /tmp/resume-after.json 2>/dev/null || echo unknown)
          lower=$(jq -r '.baseline.lower // false' /tmp/resume-after.json 2>/dev/null || echo false)
          if [ "$after" = unknown ]; then line="unknown (the resume could not be checked; see the run log)"
          elif [ "$BEFORE" = unknown ]; then line="$after/100 (main's score was not available)"
          elif [ "$lower" = true ]; then line="$BEFORE → $after, lower than on main"
          elif [ "$after" -gt "$BEFORE" ]; then line="$BEFORE → $after, higher than on main"
          else line="$BEFORE → $after, unchanged"; fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "lower=$lower" >> "$GITHUB_OUTPUT"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          # The findings that are new in this resume, for the pull request and the email.
          if [ -f /tmp/resume-before.json ] && [ -f /tmp/resume-after.json ]; then
            jq -r --slurpfile before /tmp/resume-before.json '[.findings[] | select(.severity != "info")] | map(select(. as $f | ($before[0].findings // []) | map(.id) | index($f.id) | not)) | .[] | "- [\(.severity)] \(.message)"' /tmp/resume-after.json > /tmp/resume-new-findings.txt || true
          fi
          {
            echo "### Resume score: $line"
            if [ "$lower" = true ]; then echo; echo "⚠️ This update lowers the resume score. New findings:"; cat /tmp/resume-new-findings.txt 2>/dev/null; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          TITLE: ${{ inputs.title }}
          INSTRUCTION: ${{ inputs.instruction }}
          CHECKS: ${{ steps.commit.outputs.checks }}
          SCORE_LINE: ${{ steps.score.outputs.line }}
          SCORE_LOWER: ${{ steps.score.outputs.lower }}
          SCORE_BEFORE: ${{ steps.score.outputs.before }}
          SCORE_AFTER: ${{ steps.score.outputs.after }}
          PROPOSALS: ${{ inputs.proposals }}
          SUPERSEDES: ${{ inputs.supersedes }}
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-28)
          warning=""
          if [ "$SCORE_LOWER" = true ]; then
            warning=$(printf '> ⚠️ **This update lowers the resume score from %s to %s.** An applicant tracking system would read it worse than the one live today. New findings:\n%s\n\nFix the data on this branch (or ask Claude to) before merging, or merge knowing the trade-off.\n\n' "$SCORE_BEFORE" "$SCORE_AFTER" "$(cat /tmp/resume-new-findings.txt 2>/dev/null || true)")
          fi
          # The hidden markers are read by the MCP server (site_update_status, merge_site_update, wait_for_site_update):
          # the score so Claude can warn Steven, and the request itself (title, instruction, proposals, the pull request
          # this one supersedes; base64 of JSON so nothing in it can break the comment) so the update can be redone on a
          # fresh branch when it conflicts and the proposals it carries are marked applied when it merges.
          marker=""
          if [ "$SCORE_AFTER" != unknown ] && [ -n "$SCORE_AFTER" ]; then marker="<!-- resume-score before=${SCORE_BEFORE:-unknown} after=$SCORE_AFTER -->"; fi
          request=$(jq -cn --arg title "$TITLE" --arg instruction "$INSTRUCTION" --arg proposals "$PROPOSALS" --arg supersedes "$SUPERSEDES" \
            '{title: $title, instruction: $instruction, proposals: ($proposals | split(",") | map(select(test("^[0-9]+$")) | tonumber)), supersedes: (if ($supersedes | test("^[0-9]+$")) then ($supersedes | tonumber) else null end)}' | base64 -w0)
          proposals_line=""
          if [ -n "$PROPOSALS" ]; then proposals_line=$(printf '**Résumé proposals:** %s (marked applied in the MCP server when this merges)\n\n' "$(printf '%s' "$PROPOSALS" | sed 's/,/, #/g; s/^/#/')"); fi
          body=$(printf '%s%s%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n%s\n%s' \
            "$warning" "$proposals_line" \
            "**Instruction**" "$INSTRUCTION" \
            "**Resume score:** ${SCORE_LINE:-unknown} (the ATS score: 100 means an applicant tracking system parses every part of it; see scripts/resume-check.mjs)" \
            "**Checks in this run:** $CHECKS (lint, tests, build). Preview, once the Deploy workflow for this branch finishes: https://$alias.stevenwilssens.pages.dev" \
            "Merging deploys to production. Review the resume PDF in the branch before merging." \
            "🤖 Generated with [Claude Code](https://claude.com/claude-code) from a request made through the MCP server." \
            "$marker" \
            "<!-- site-update-request $request -->")
          url=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body")
          # A push made with the built-in token starts no workflow, so start the preview build explicitly.
          gh workflow run deploy.yml --ref "$BRANCH"
          # A redo closes the pull request it replaces, with a pointer to the new one.
          if [ -n "$SUPERSEDES" ]; then
            gh pr comment "$SUPERSEDES" --body "Superseded by $url: the same update, redone on a fresh branch from main." || true
            gh pr close "$SUPERSEDES" --delete-branch || gh pr close "$SUPERSEDES" || true
          fi
          echo "### Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview (a few minutes after the Deploy workflow for the branch finishes): https://$alias.stevenwilssens.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "preview=https://$alias.stevenwilssens.pages.dev" >> "$GITHUB_OUTPUT"
          if git diff --name-only origin/main...HEAD | grep -qE '^(public/steven-wilssens-resume-2026\.pdf|src/resume\.ts)$'; then echo "resume_changed=true" >> "$GITHUB_OUTPUT"; else echo "resume_changed=false" >> "$GITHUB_OUTPUT"; fi

      # Steven asked to be told when the resume has been updated: here, when a pull request with a new resume is ready to review.
      # scripts/resume-mail.mjs reads src/resume.ts on main and on the branch, has Claude say in plain words what is different
      # (without the key it lists the changes itself), adds the score against main and the new findings, and sends the HTML email.
      - name: Email Steven that the resume is ready to review
        if: steps.pr.outputs.resume_changed == 'true'
        continue-on-error: true
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PREVIEW: ${{ steps.pr.outputs.preview }}
          TITLE: ${{ inputs.title }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: node scripts/resume-mail.mjs review --before origin/main --after HEAD --report /tmp/resume-after.json --new-findings /tmp/resume-new-findings.txt --title "$TITLE" --instruction "$INSTRUCTION" --pr "$PR_URL" --preview "$PREVIEW" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
